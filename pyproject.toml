[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]


[project]
name = "spatialdata_notebooks"
version = "0.0.1"
description = "Tutorials and examples for SpatialData"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "scverse"},
]
maintainers = [
    {name = "scverse", email = "core@scverse.org"},
]
urls.Documentation = "https://spatialdata-notebooks.readthedocs.io/"
urls.Source = "https://github.com/scverse/spatialdata-notebooks"
urls.Home-page = "https://github.com/scverse/spatialdata-notebooks"
dependencies = ["spatialdata", "squidpy>=1.6.2"]

[project.optional-dependencies]
dev = [
    "pre-commit",
	"watermark"
]
doc = [
    "sphinx>=4.5",
    "sphinx-book-theme>=0.3.3",
    "myst-nb",
    "sphinxcontrib-bibtex>=1.0.0",
    "sphinx-autodoc-typehints",
	"sphinx-design",
    # For notebooks
    "ipython>=8.6.0",
    "sphinx-copybutton",
]
pre = [
    "spatialdata>=0.4.0rc0"
]

[dependency-groups]
# What the notebooks in notebooks/examples import, so they can run (e.g. in spatialdata-integration-testing:
# `pip install --group pyproject.toml:examples`). The docs build does not execute notebooks and doesn't need it.
examples = [
    "spatialdata",
    "spatialdata-io",
    "spatialdata-plot",
    "squidpy",
    "anndata",
    "annsel",
    "dask",
    "geopandas",
    "matplotlib",
    "monai",
    "numpy",
    "pandas",
    "pytest",
    "pytorch-lightning",
    "requests",
    "scanpy",
    "scikit-image",
    "scipy",
    "shapely",
    "torch",
    # 0.6.0 breaks sc.pp.neighbors on the pynndescent path (n_obs >= 8192) with a numba TypingError
    # (lmcinnes/umap#1335, fixed by #1337); drop the exclusion once 0.6.1 is released
    "umap-learn!=0.6.0",
]

[tool.ruff]
line-length = 120
exclude = ["notebooks/developers_resources/storage_format/__template__.ipynb"]

[tool.ruff.lint]
ignore = ["E402", "F821"]

[tool.jupytext]
formats = "ipynb,md"

[tool.hatch.build.targets.wheel]
packages = ["notebooks"]
